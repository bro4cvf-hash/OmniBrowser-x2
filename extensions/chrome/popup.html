<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      color: #333;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 12px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 6px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .status.connected {
      background: #e8f5e9;
      color: #2e7d32;
    }
    .status.disconnected {
      background: #ffebee;
      color: #c62828;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .dot.green { background: #4caf50; }
    .dot.red { background: #f44336; }
    .info {
      font-size: 12px;
      color: #666;
      line-height: 1.5;
    }
    .code {
      background: #f5f5f5;
      padding: 8px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      margin-top: 8px;
      word-break: break-all;
    }
    a {
      color: #667eea;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>
    <div class="logo"></div>
    OmniBrowser
  </h1>

  <div id="status" class="status disconnected">
    <span class="dot red"></span>
    <span>Checking connection...</span>
  </div>

  <div class="info">
    <p>Multi-profile browser automation for AI agents.</p>
    <p>Works with Claude Code, GPT, Kimi K2, and more.</p>
  </div>

  <div class="info" style="margin-top: 12px;">
    <strong>Extension ID:</strong>
    <div class="code" id="extensionId"></div>
  </div>

  <div class="info" style="margin-top: 12px;">
    <a href="https://github.com/seahyc/omnibrowser" target="_blank">GitHub</a> ·
    <a href="https://github.com/seahyc/omnibrowser#readme" target="_blank">Docs</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
